<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cash Drawer Count — The Oaks Laundry</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f2f2f0; min-height: 100vh; padding: 1.5rem 1rem 3rem; }
  .card { background: #fff; border-radius: 14px; max-width: 480px; margin: 0 auto; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  .card-header { background: #1a1a2e; padding: 1.25rem 1.5rem; }
  .card-header h1 { color: #fff; font-size: 20px; font-weight: 600; }
  .card-header p { color: #8888aa; font-size: 13px; margin-top: 3px; }
  .shift-bar { display: flex; border-bottom: 1px solid #ebebeb; }
  .shift-bar button { flex: 1; padding: 12px 8px; border: none; background: #fff; font-size: 13px; font-weight: 500; color: #888; cursor: pointer; border-bottom: 2px solid transparent; }
  .shift-bar button.active { color: #1a1a2e; border-bottom-color: #1a1a2e; }
  .section { padding: 1rem 1.5rem 0; }
  .section-label { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #aaa; margin-bottom: 8px; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; font-weight: 500; }
  .field .hint { font-size: 11px; color: #999; margin-top: 3px; }
  select, .money, textarea, .num { width: 100%; height: 42px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; padding: 0 12px; color: #1a1a2e; background: #fff; }
  textarea { height: 70px; padding: 10px 12px; font-family: inherit; resize: vertical; }
  .row2 { display: flex; gap: 10px; }
  .row2 .field { flex: 1; }
  .check { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #1a1a2e; padding: 6px 0; }
  .check input { width: 20px; height: 20px; }
  .prev-box { background: #f4f6fb; border-radius: 8px; padding: 10px 14px; margin: 1rem 1.5rem 0; font-size: 13px; color: #445; line-height: 1.45; }
  .denom-row { display: flex; align-items: center; padding: 9px 0; border-bottom: 1px solid #f0f0f0; gap: 10px; }
  .denom-row:last-child { border-bottom: none; }
  .denom-name { flex: 1; font-size: 15px; color: #1a1a2e; font-weight: 500; }
  .qty-controls { display: flex; align-items: center; gap: 6px; }
  .qty-controls button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid #ddd; background: #f7f7f7; font-size: 18px; cursor: pointer; }
  .qty-controls input { width: 52px; height: 30px; border: 1px solid #ddd; border-radius: 8px; text-align: center; font-size: 14px; }
  .denom-sub { min-width: 60px; text-align: right; font-size: 13px; color: #888; }
  .total-card { background: #f7f7f5; border-radius: 10px; padding: 1rem 1.25rem; margin: 1.25rem 1.5rem 0.5rem; }
  .total-top { display: flex; justify-content: space-between; align-items: center; }
  .total-lbl { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 500; }
  .total-amt { font-size: 30px; font-weight: 700; color: #1a1a2e; }
  .status { font-size: 13px; margin-top: 4px; font-weight: 500; }
  .status.ok, .expected.ok { color: #2d8a4e; }
  .status.low, .expected.low { color: #c0392b; }
  .expected { font-size: 13px; margin-top: 8px; padding-top: 8px; border-top: 1px solid #e6e6e2; color: #555; }
  .owner-alert { background: #fff7e6; color: #9a5b00; border-radius: 8px; padding: 12px 14px; margin: 0.5rem 1.5rem; font-size: 13px; font-weight: 600; display: none; }
  .low-alert, .issue-alert { background: #fdf0f0; border-radius: 8px; padding: 10px 14px; margin: 0.5rem 1.5rem; font-size: 13px; color: #c0392b; font-weight: 500; display: none; }
  .withdraw-box { border-top: 1px solid #ebebeb; margin-top: 1rem; padding-bottom: 1rem; }
  .submit-wrap { padding: 0.75rem 1.5rem 1.5rem; }
  .submit-btn { width: 100%; padding: 13px; border: none; border-radius: 10px; background: #1a1a2e; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
  .submit-btn.secondary { background: #fff; color: #1a1a2e; border: 1.5px solid #1a1a2e; }
  .submit-btn:disabled { background: #aaa; color: #fff; border-color: #aaa; cursor: not-allowed; }
  .toast { display: none; margin: 0 1.5rem 1.5rem; padding: 12px 14px; border-radius: 8px; font-size: 14px; font-weight: 500; }
  .toast.success { background: #eafaf1; color: #1e7e45; display: block; }
  .toast.error { background: #fdf0f0; color: #c0392b; display: block; }
</style>
</head>
<body>
<div class="card">
  <div class="card-header">
    <h1>Cash drawer count</h1>
    <p>The Oaks Laundry</p>
  </div>

  <div class="shift-bar">
    <button class="active" onclick="setShift(this,'Morning')">Morning</button>
    <button onclick="setShift(this,'Afternoon')">Afternoon</button>
    <button onclick="setShift(this,'Evening')">Evening</button>
  </div>

  <div class="prev-box" id="prevBox">Loading last count…</div>

  <div class="section">
    <div class="section-label">Who</div>
    <div class="field">
      <label for="emp">Counting employee</label>
      <select id="emp"></select>
    </div>
    <div class="field" id="takingOverField">
      <label for="takingOver">Taking over the drawer</label>
      <select id="takingOver" onchange="calc()"></select>
    </div>
    <label class="check" id="agreeWrap"><input type="checkbox" id="agreed" onchange="calc()"> Next person watched this count and agrees</label>
  </div>

  <div class="section">
    <div class="section-label">This shift</div>
    <div class="row2">
      <div class="field" id="salesField">
        <label for="sales">Cleantie cash sales today</label>
        <input class="money" id="sales" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" oninput="calc()">
        <div class="hint">The day's running total from Cleantie — not just your shift. Leave blank on the first count of the day.</div>
      </div>
      <div class="field">
        <label for="carts">Cart count</label>
        <input class="num" id="carts" type="number" inputmode="numeric" min="0" placeholder="Required">
      </div>
    </div>
  </div>

  <div class="section"><div class="section-label">Bills</div><div id="bills"></div></div>
  <div class="section"><div class="section-label">Coins</div><div id="coins"></div></div>

  <div class="total-card">
    <div class="total-top">
      <div><div class="total-lbl">Total</div><div class="status" id="status">—</div></div>
      <div class="total-amt" id="total">$0.00</div>
    </div>
    <div class="expected" id="expected"></div>
  </div>

  <div class="owner-alert" id="ownerAlert"></div>
  <div class="low-alert" id="lowAlert"></div>
  <div class="issue-alert" id="issueAlert"></div>

  <div class="section">
    <div class="field">
      <label for="note">Note on any difference</label>
      <textarea id="note" placeholder="Required if the drawer doesn't match. Cash refund? Write 'Refund $___' here and fill out a paper refund slip."></textarea>
    </div>
  </div>

  <div class="submit-wrap"><button class="submit-btn" id="countBtn" onclick="submitCount()">Submit drawer count</button></div>

  <div class="section withdraw-box">
    <div class="section-label">Owner withdrawal</div>
    <div class="row2">
      <div class="field">
        <label for="withdrawOwner">Owner</label>
        <select id="withdrawOwner"></select>
      </div>
      <div class="field">
        <label for="withdrawAmount">Amount removed</label>
        <input class="money" id="withdrawAmount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00">
      </div>
    </div>
    <div class="hint" id="withdrawHint" style="font-size:11px;color:#999;margin:-4px 0 10px;">Record this only after an owner physically removes cash.</div>
    <button type="button" class="submit-btn secondary" id="withdrawBtn" onclick="submitWithdrawal()">Record owner withdrawal</button>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
  var EMAILJS_PUBLIC_KEY='ndWWB1hJwPp1a_UvF';
  var EMAILJS_SERVICE_ID='service_vt5n8lc';
  var EMAILJS_TEMPLATE_ID='template_m2zbjc3';
  var OWNER_EMAIL='oaklaundromat@gmail.com';
  var APPROVED_BANK=400;
  var OWNER_WITHDRAWAL_ALERT=100;
  var TOLERANCE=1.00;
  var GOOGLE_SHEET_URL='https://script.google.com/macros/s/AKfycbyiauTAC7ayYeNSAGdpIeWB7G_Uc9Z-1dC4Pw0IWxgiz-1BuDa9M7R9hOM5Q60bgvW6/exec';

  var STAFF=['Cinthia','Brian','Romero','Maria','Juan','Manager'];
  var OWNERS=['Hamid','Raihana','Mina'];

  var LOW_THRESHOLDS={
    'd_1bills':{min:25,label:'$1 bills'},
    'd_5bills':{min:8,label:'$5 bills'},
    'd_Quarters':{min:20,label:'Quarters'},
    'd_Dimes':{min:20,label:'Dimes'},
    'd_Nickels':{min:40,label:'Nickels'},
    'd_Pennies':{min:50,label:'Pennies'}
  };

  emailjs.init(EMAILJS_PUBLIC_KEY);
  var currentShift='Morning';
  var bills=[{label:'$100 bills',val:100},{label:'$50 bills',val:50},{label:'$20 bills',val:20},{label:'$10 bills',val:10},{label:'$5 bills',val:5},{label:'$1 bills',val:1}];
  var coins=[{label:'Quarters',val:0.25},{label:'Dimes',val:0.10},{label:'Nickels',val:0.05},{label:'Pennies',val:0.01}];

  function fillSelect(id,first,items){
    var h='<option value="">'+first+'</option>';
    for(var i=0;i<items.length;i++){h+='<option>'+items[i]+'</option>';}
    document.getElementById(id).innerHTML=h;
  }
  fillSelect('emp','Select employee',STAFF);
  fillSelect('takingOver','End of day — nobody taking over',STAFF);
  fillSelect('withdrawOwner','Select owner',OWNERS);

  function buildRows(items,cid){
    var c=document.getElementById(cid);
    for(var i=0;i<items.length;i++){
      var item=items[i];var id='d_'+item.label.replace(/\W/g,'');
      var row=document.createElement('div');row.className='denom-row';
      row.innerHTML='<div class="denom-name">'+item.label+'</div><div class="qty-controls">'+
        '<button type="button" onclick="adj(\''+id+'\',-1)">−</button>'+
        '<input type="number" inputmode="numeric" id="'+id+'" value="0" min="0" data-val="'+item.val+'" oninput="calc()">'+
        '<button type="button" onclick="adj(\''+id+'\',1)">+</button></div>'+
        '<div class="denom-sub" id="sub_'+id+'">$0.00</div>';
      c.appendChild(row);
    }
  }
  buildRows(bills,'bills');buildRows(coins,'coins');

  function setShift(btn,name){var b=document.querySelectorAll('.shift-bar button');for(var i=0;i<b.length;i++)b[i].classList.remove('active');btn.classList.add('active');currentShift=name;}
  function adj(id,d){var el=document.getElementById(id);el.value=Math.max(0,(parseInt(el.value)||0)+d);calc();}
  function r2(n){return Math.round(n*100)/100;}
  function money(n){return '$'+Math.abs(n).toFixed(2);}
  function signed(n){return (n>=0?'+':'-')+money(n);}
  function todayStr(){return new Date().toLocaleDateString('en-US',{month:'2-digit',day:'2-digit',year:'numeric'});}
  function numVal(id){var v=document.getElementById(id).value;return v===''?null:(parseFloat(v)||0);}

  function checkLowDenoms(){
    var warnings=[];var keys=Object.keys(LOW_THRESHOLDS);
    for(var i=0;i<keys.length;i++){
      var k=keys[i];var el=document.getElementById(k);if(!el)continue;
      var qty=parseInt(el.value)||0;
      if(qty<LOW_THRESHOLDS[k].min)warnings.push(LOW_THRESHOLDS[k].label+': '+qty+' (need '+LOW_THRESHOLDS[k].min+')');
    }
    var a=document.getElementById('lowAlert');
    var counted=0;var dEls=document.querySelectorAll('[data-val]');
    for(var j=0;j<dEls.length;j++)counted+=parseInt(dEls[j].value)||0;
    if(warnings.length&&counted>0){a.innerHTML='Running low on change — get more of these from the bank:<br>'+warnings.join('<br>');a.style.display='block';}else{a.style.display='none';}
    return warnings;
  }

  var connStatus='loading';
  var book=null;

  function normTime(x){
    var s=String(x||'');
    if(/^\d{1,2}:\d{2}\s?(AM|PM)$/i.test(s))return s;
    var d=new Date(s);
    return isNaN(d)?s:d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  }
  function shortDate(key){
    if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(String(key||''))){
      var m=key.split('/');
      return new Date(Number(m[2]),Number(m[0])-1,Number(m[1])).toLocaleDateString('en-US',{month:'short',day:'numeric'});
    }
    var p=String(key||'').split('-');
    if(p.length!==3)return String(key||'');
    return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('en-US',{month:'short',day:'numeric'});
  }

  function loadBook(){
    var timeout=new Promise(function(res){setTimeout(function(){res('TIMEOUT');},60000);});
    var req=fetch(GOOGLE_SHEET_URL+'?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).catch(function(){return 'ERROR';});
    return Promise.race([req,timeout]).then(function(p){
      if(p==='TIMEOUT'||p==='ERROR'||p===null||typeof p!=='object'||p.success===false){connStatus='error';book=null;return null;}
      if(!p.last){connStatus='empty';book=null;return null;}
      connStatus='ok';
      p.wdSinceLast=Number(p.last.withdrawalsSinceCount||0);
      p.wdSinceTodayOpen=p.todayOpen&&p.todayOpen.submissionId===p.last.submissionId
        ?p.wdSinceLast:Number(p.wdSinceTodayOpen||0);
      if(p.last)p.last.time=normTime(p.last.time);
      if(p.todayOpen)p.todayOpen.time=normTime(p.todayOpen.time);
      if(p.prevClose)p.prevClose.time=normTime(p.prevClose.time);
      book=p;return p;
    });
  }

  function isOpening(){return !book||!book.todayOpen;}
  function wdSinceAnchor(){return book?(book.todayOpen?Number(book.wdSinceTodayOpen||0):Number(book.wdSinceLast||0)):0;}

  function renderPrev(){
    var b=document.getElementById('prevBox');
    if(!book){
      b.innerHTML=connStatus==='error'
        ?'<b style="color:#c0392b">Can\'t reach the count records.</b> Finish your count and submit, then tell the owner the app couldn\'t load the last count.'
        :'No previous count on record yet. This count will start the log.';
      return;
    }
    var h='';
    if(book.prevClose&&isOpening())
      h+='Last night\'s close: <b>$'+book.prevClose.total.toFixed(2)+'</b> — '+book.prevClose.employee+', '+shortDate(book.prevClose.date)+' '+book.prevClose.time+'<br>';
    if(book.todayOpen)
      h+='Opened today: <b>$'+book.todayOpen.total.toFixed(2)+'</b> — '+book.todayOpen.employee+', '+book.todayOpen.time+'<br>';
    h+='Last count: <b>$'+book.last.total.toFixed(2)+'</b> — '+book.last.employee+', '+book.last.shift+', '+book.last.time;
    var w=wdSinceAnchor();
    if(w>0)h+='<br>Owner withdrawals since'+(book.todayOpen?' open':' then')+': <b>$'+w.toFixed(2)+'</b>';
    if(isOpening())h+='<br>First count of the day — no handoff needed.';
    b.innerHTML=h;
  }

  function firstTimeOver(total){
    if(!book)return false;
    var nowOver=(total-APPROVED_BANK)>=OWNER_WITHDRAWAL_ALERT;
    var wasOver=(Number(book.last.total)-Number(book.wdSinceLast||0)-APPROVED_BANK)>=OWNER_WITHDRAWAL_ALERT;
    return nowOver&&!wasOver;
  }

  function evaluate(total){
    var sales=numVal('sales');
    var takingOver=document.getElementById('takingOver').value;
    var agreed=document.getElementById('agreed').checked;
    var r={issues:[],expectedText:'',expectedClass:'',needsNote:false,alertOwner:false,expected:null,diff:null,causes:[]};
    if(book){
      var w=wdSinceAnchor();
      if(isOpening()){
        var a=book.prevClose||book.last;
        var exp1=r2(a.total-w);var gap=r2(total-exp1);
        r.expected=exp1;r.diff=gap;
        if(Math.abs(gap)<=TOLERANCE){r.expectedText='Matches last night\'s close of $'+a.total.toFixed(2);r.expectedClass='ok';}
        else{
          r.issues.push('OVERNIGHT DIFFERENCE '+signed(gap));r.needsNote=true;r.alertOwner=true;
          r.expectedText='Expected $'+exp1.toFixed(2)+' from last night\'s close — difference '+signed(gap);r.expectedClass='low';
          r.causes.push(gap<0?'Cash left the drawer overnight — a withdrawal nobody logged, or last night\'s count was over.'
                             :'More cash than last night — last night\'s count was likely short, or money was added.');
        }
      }else if(sales===null){
        r.expectedText='Enter today\'s running cash sales total from Cleantie.';r.expectedClass='';
      }else{
        var exp2=r2(book.todayOpen.total+sales-w);var diff=r2(total-exp2);
        r.expected=exp2;r.diff=diff;
        if(Math.abs(diff)<=TOLERANCE){r.expectedText='Expected $'+exp2.toFixed(2)+' — matches';r.expectedClass='ok';}
        else{
          r.issues.push('DIFFERENCE '+signed(diff));r.needsNote=true;r.alertOwner=true;
          r.expectedText='Expected $'+exp2.toFixed(2)+' — difference '+signed(diff);r.expectedClass='low';
          var lastSales=(book.last.sales===null||book.last.sales===undefined)?null:Number(book.last.sales);
          if(diff>0&&lastSales!==null&&Math.abs(diff-lastSales)<=0.02)
            r.causes.push('The sales figure looks like this shift only. Cleantie\'s box needs the day\'s running total, which already includes the $'+lastSales.toFixed(2)+' reported earlier.');
          if(diff<0&&Math.abs(diff+sales)<=0.02)
            r.causes.push('The drawer is short by exactly today\'s sales — the cash may never have gone in, or the sales total belongs to a different day.');
          if(Math.abs(diff)<=2)r.causes.push('Small enough to be a miscount — recount the coins and the $1s.');
          if(diff<0)r.causes.push('Cash out with no record: a refund paid from the drawer, or an owner withdrawal that wasn\'t logged.');
          else r.causes.push('Extra cash: a card or account sale may have been rung as cash, or the Cleantie total is understated.');
        }
      }
    }
    // No handoff on the first count of the day — nobody is there to confirm
    if(!isOpening()&&takingOver&&!agreed){r.issues.push('NEXT PERSON DID NOT CONFIRM');r.needsNote=true;r.alertOwner=true;}
    return r;
  }

  function calc(){
    var total=0;var els=document.querySelectorAll('[data-val]');
    for(var i=0;i<els.length;i++){
      var el=els[i];var sub=(parseInt(el.value)||0)*parseFloat(el.dataset.val);total+=sub;
      document.getElementById('sub_'+el.id).textContent='$'+sub.toFixed(2);
    }
    total=r2(total);
    document.getElementById('total').textContent='$'+total.toFixed(2);
    var bankDiff=r2(total-APPROVED_BANK);
    var s=document.getElementById('status');
    if(total===0){s.textContent='Start counting';s.className='status';}
    else if(total<APPROVED_BANK){s.textContent=money(bankDiff)+' under the $'+APPROVED_BANK+' bank';s.className='status low';}
    else if(bankDiff>0){s.textContent='+'+money(bankDiff)+' above bank';s.className='status ok';}
    else{s.textContent='Balanced — $'+APPROVED_BANK.toFixed(2);s.className='status ok';}

    var oa=document.getElementById('ownerAlert');var hint=document.getElementById('withdrawHint');
    if(bankDiff>=OWNER_WITHDRAWAL_ALERT){
      oa.innerHTML='Drawer is <b>$'+bankDiff.toFixed(2)+'</b> above the $'+APPROVED_BANK.toFixed(2)+' bank — ready for an owner withdrawal.';
      oa.style.display='block';
      hint.textContent='Suggested: $'+bankDiff.toFixed(2)+' returns the drawer to $'+APPROVED_BANK.toFixed(2)+'. Record only after an owner physically removes cash.';
    }else{
      oa.style.display='none';
      hint.textContent='Record this only after an owner physically removes cash.';
    }

    // Hide the handoff question entirely on the first count of the day
    var op=isOpening();
    var toEl=document.getElementById('takingOver');
    document.getElementById('takingOverField').style.display=op?'none':'block';
    if(op)toEl.value='';
    document.getElementById('agreeWrap').style.display=(!op&&toEl.value)?'flex':'none';

    var ev=evaluate(total);
    var ex=document.getElementById('expected');
    ex.textContent=ev.expectedText;ex.className='expected '+ev.expectedClass;ex.style.display=ev.expectedText?'block':'none';
    var ia=document.getElementById('issueAlert');
    if(ev.needsNote){ia.innerHTML='Needs a note before submitting:<br>'+ev.issues.join('<br>');ia.style.display='block';}else{ia.style.display='none';}
    checkLowDenoms();
    return{total:total,diff:bankDiff};
  }

  function makeId(prefix){
    var d=new Date();function pad(n){return String(n).padStart(2,'0');}
    return prefix+'-'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds())+'-'+Math.random().toString(36).slice(2,6).toUpperCase();
  }

  function post(data){
    return fetch(GOOGLE_SHEET_URL,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(data)
    })
    .then(function(r){
      if(!r.ok)throw new Error('Script returned HTTP '+r.status);
      return r.json();
    })
    .then(function(result){
      if(!result.success)throw new Error(result.error||'Script rejected the submission');
      if(result.submissionId!==data.submissionId)throw new Error('Script returned the wrong submission ID');
      return result;
    });
  }

  function confirmCount(id){
    var delays=[0,1200,2400,4000,6000];
    function attempt(i){
      return new Promise(function(resolve){setTimeout(resolve,delays[i]);}).then(function(){
        return fetch(GOOGLE_SHEET_URL+'?check='+encodeURIComponent(id)+'&t='+Date.now(),{cache:'no-store'})
          .then(function(r){if(!r.ok)throw new Error('Ledger unavailable');return r.json();})
          .then(function(p){
            if(p.success===false)throw new Error(p.error||'Ledger error');
            return p.last&&p.last.submissionId===id?p.last:null;
          }).catch(function(){return null;});
      }).then(function(saved){
        if(saved)return saved;
        if(i+1<delays.length)return attempt(i+1);
        throw new Error('Submission not confirmed in the sheet');
      });
    }
    return attempt(0);
  }

  function stopSubmit(btn,msg,focusId){
    showToast(msg,'error');btn.disabled=false;btn.textContent='Submit drawer count';
    if(focusId)document.getElementById(focusId).focus();
  }

  function submitCount(){
    var employee=document.getElementById('emp').value;
    if(!employee){showToast('Please select who is counting.','error');return;}
    var btn=document.getElementById('countBtn');btn.disabled=true;btn.textContent='Checking…';
    var currentSubmissionId='';

    loadBook().then(function(){
      renderPrev();
      var total=calc().total;
      var ev=evaluate(total);
      var sales=numVal('sales');
      var note=document.getElementById('note').value.trim();

      if(book&&!isOpening()&&sales===null)return stopSubmit(btn,'Enter today\'s running cash sales total from Cleantie.','sales');
      if(document.getElementById('carts').value==='')return stopSubmit(btn,'Enter the cart count.','carts');
      if(ev.needsNote&&!note)return stopSubmit(btn,'Add a note explaining the difference.','note');

      btn.textContent='Submitting…';
      var lowWarnings=checkLowDenoms();
      var date=todayStr();
      var time=new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
      var id=makeId('CD');
      currentSubmissionId=id;
      var takingOver=isOpening()?'':document.getElementById('takingOver').value;
      var agreed=document.getElementById('agreed').checked;
      var w=wdSinceAnchor();
      var crossedOver=firstTimeOver(total);

      var expectedValue=(ev.expected===null||ev.expected===undefined)?'':ev.expected;
      var differenceValue=(ev.diff===null||ev.diff===undefined)?'':ev.diff;

      var denomData={};var lines=[];var allItems=bills.concat(coins);
      for(var i=0;i<allItems.length;i++){
        var item=allItems[i];var qty=parseInt(document.getElementById('d_'+item.label.replace(/\W/g,'')).value)||0;
        denomData[item.label]=qty;
        if(qty>0)lines.push(item.label+' x '+qty+' = $'+(qty*item.val).toFixed(2));
      }

      var bankDiff=r2(total-APPROVED_BANK);
      var statusText=total<APPROVED_BANK?'SHORT — '+money(bankDiff):(bankDiff>0?'ABOVE BANK +'+money(bankDiff):'BALANCED');
      if(ev.issues.length)statusText+=' | '+ev.issues.join(' | ');

      var sheetPromise=post({
        action:'count',submissionId:id,date:date,time:time,employee:employee,shift:currentShift,total:total.toFixed(2),status:statusText,
        hundreds:denomData['$100 bills']||0,fifties:denomData['$50 bills']||0,twenties:denomData['$20 bills']||0,tens:denomData['$10 bills']||0,fives:denomData['$5 bills']||0,ones:denomData['$1 bills']||0,
        quarters:denomData['Quarters']||0,dimes:denomData['Dimes']||0,nickels:denomData['Nickels']||0,pennies:denomData['Pennies']||0,
        sales:(sales===null?'':sales),expected:expectedValue,difference:differenceValue,withdrawalsSinceCount:w,
        carts:document.getElementById('carts').value,takingOver:takingOver,agreed:(takingOver?(agreed?'Yes':'No'):''),note:note
      });

      var needsAlert=total<APPROVED_BANK||lowWarnings.length>0||ev.alertOwner||crossedOver;

      var body='';
      if(ev.issues.length)body+=ev.issues.join('\n')+'\n\n';
      if(book){
        if(book.prevClose)body+='Last night close   $'+book.prevClose.total.toFixed(2)+'   '+book.prevClose.employee+', '+shortDate(book.prevClose.date)+' '+book.prevClose.time+'\n';
        if(book.todayOpen)body+='Opened today       $'+book.todayOpen.total.toFixed(2)+'   '+book.todayOpen.employee+', '+book.todayOpen.time+'\n';
        if(book.todayOpen&&book.prevClose)body+='Overnight change   '+signed(r2(book.todayOpen.total-book.prevClose.total))+'\n';
        if(sales!==null)body+='Cash sales today  +$'+Number(sales).toFixed(2)+'   (Cleantie running total)\n';
        if(w>0)body+='Owner withdrawals  -$'+w.toFixed(2)+'\n';
        if(ev.expected!==null&&ev.expected!==undefined)body+='Expected now       $'+Number(ev.expected).toFixed(2)+'\n';
      }
      body+='Counted now        $'+total.toFixed(2)+'   '+employee+', '+currentShift+' '+time+'\n';
      if(ev.diff!==null&&ev.diff!==undefined&&Math.abs(ev.diff)>TOLERANCE)body+='DIFFERENCE         '+signed(ev.diff)+'\n';
      if(ev.causes.length)body+='\nLikely cause:\n- '+ev.causes.join('\n- ')+'\n';
      if(note)body+='\nStaff note: '+note+'\n';
      if(takingOver)body+='Handed to: '+takingOver+(agreed?' (confirmed)':' (DID NOT CONFIRM)')+'\n';
      if(crossedOver)body+='\nDrawer is $'+bankDiff.toFixed(2)+' over the bank — ready for a withdrawal. No further emails about this until it drops back under.\n';
      if(lowWarnings.length)body+='\nRunning low on change: '+lowWarnings.join(', ')+'\n';
      body+='\nDenominations:\n'+lines.join('\n')+'\n\nID: '+id;

      var tag=ev.issues.length?ev.issues[0].split(' ').slice(0,2).join(' ')
        :(total<APPROVED_BANK?'Drawer Short':(crossedOver?'Drawer $100+ Over Bank':'Low Change'));

      var sendAlert=function(){return needsAlert?emailjs.send(EMAILJS_SERVICE_ID,EMAILJS_TEMPLATE_ID,{
        to_email:OWNER_EMAIL,subject:tag+' — '+employee+' — '+new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'})+' '+time,employee:employee,shift:currentShift,
        timestamp:date+' '+time,total:'$'+total.toFixed(2),approved:'$'+APPROVED_BANK.toFixed(2),difference:statusText,breakdown:body
      }):Promise.resolve();};

      return sheetPromise.then(function(){return confirmCount(id);}).then(function(){
        showToast('Count saved in the sheet — '+id,'success');btn.textContent='Saved';
        return sendAlert().catch(function(err){
          console.error('Alert email failed',err);
          showToast('Count saved in the sheet — '+id+'. Alert email failed.','success');
        });
      });
    }).catch(function(err){
      console.error(err);
      showToast('Count NOT saved: '+(err&&err.message||'Unknown error')+'. Keep the count and tell the owner. ID: '+(currentSubmissionId||'unknown'),'error');
      btn.disabled=false;
      btn.textContent='Submit drawer count';
    });
  }

  function submitWithdrawal(){
    var owner=document.getElementById('withdrawOwner').value;
    var amount=numVal('withdrawAmount');
    var btn=document.getElementById('withdrawBtn');
    if(!owner){showToast('Select Hamid, Raihana, or Mina.','error');return;}
    if(amount===null||amount<=0){showToast('Enter the amount physically removed.','error');return;}

    btn.disabled=true;btn.textContent='Recording…';
    loadBook().then(function(bk){
      var last=bk?bk.last:null;
      if(!last){
        showToast('Submit a drawer count before recording a withdrawal.','error');
        btn.disabled=false;btn.textContent='Record owner withdrawal';return;
      }
      var date=todayStr();
      var time=new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
      var id=makeId('OW');
      var priorW=Number(bk.wdSinceLast||0);
      var available=Math.max(0,r2(Number(last.total)-APPROVED_BANK-priorW));

      var sheetPromise=post({
        action:'ownerWithdrawal',submissionId:id,date:date,time:time,owner:owner,amount:amount,
        relatedCountId:last.submissionId||'',priorCountTotal:Number(last.total),priorWithdrawals:priorW,availableAboveBank:available
      });

      var emailPromise=emailjs.send(EMAILJS_SERVICE_ID,EMAILJS_TEMPLATE_ID,{
        to_email:OWNER_EMAIL,subject:'Owner Withdrawal $'+amount.toFixed(2)+' — '+owner+' — '+date+' '+time,
        employee:owner,shift:'Owner Withdrawal',timestamp:date+' '+time,total:'$'+amount.toFixed(2),approved:'$'+APPROVED_BANK.toFixed(2),
        difference:'OWNER WITHDRAWAL',
        breakdown:'OWNER WITHDRAWAL LOGGED\nOwner: '+owner+'\nAmount: $'+amount.toFixed(2)+'\nTime: '+date+' '+time+
          '\nLast drawer count: $'+Number(last.total).toFixed(2)+' by '+last.employee+
          (priorW>0?'\nEarlier withdrawals since that count: $'+priorW.toFixed(2):'')+
          '\nWithdrawal ID: '+id+'\n\nIf this was not you, look into it.'
      });

      return Promise.all([sheetPromise,emailPromise]).then(function(){
        document.getElementById('withdrawAmount').value='';
        document.getElementById('withdrawOwner').value='';
        showToast('Owner withdrawal recorded — '+id,'success');
        btn.disabled=false;btn.textContent='Record owner withdrawal';
        return loadBook();
      }).then(function(){renderPrev();calc();});
    }).catch(function(err){
      console.error(err);showToast('Owner withdrawal submission error.','error');
      btn.disabled=false;btn.textContent='Record owner withdrawal';
    });
  }

  function showToast(msg,type){var t=document.getElementById('toast');t.textContent=msg;t.className='toast '+type;}

  loadBook().then(function(){renderPrev();calc();});
  calc();
</script>
</body>
